name: Release Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # How many releases to keep. Older ones (and their tags) are deleted after
  # each successful release. Set to 0 to disable pruning.
  KEEP_RELEASES: "5"

jobs:
  release:
    # Skip the run triggered by our own version-bump commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src/manifest.json').version")

          taken() {
            git rev-parse -q --verify "refs/tags/v$1" >/dev/null 2>&1 \
              || gh release view "v$1" >/dev/null 2>&1
          }

          # Bump until the version is actually free. A single bump is not enough:
          # if an earlier run tagged a release but could not push its bump back to
          # main, the checked-out manifest still names a version that is already
          # taken, and one step forward would land on another taken one.
          for _ in $(seq 1 50); do
            taken "$version" || break
            echo "v$version already exists - bumping patch version"
            npm run bump-version
            version=$(node -p "require('./src/manifest.json').version")
          done

          if taken "$version"; then
            echo "::error::Could not find a free version after 50 bumps; last tried v$version."
            exit 1
          fi

          # Keep the GitHub Pages site in docs/ showing the version being shipped.
          node scripts/sync-site-version.js "$version"

          # One commit covers both the version bump and the site update.
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release v$version [skip ci]"

            if ! git push origin HEAD:main; then
              echo "::error::Pushing the v$version version bump to main was rejected."
              echo "This usually means a ruleset or branch protection now guards main."
              echo "Actions has to push this commit, so give it a bypass:"
              echo "  Settings -> Rules -> Rulesets -> (the ruleset covering main)"
              echo "  -> Bypass list -> Add bypass -> Repository admin / Deploy keys"
              echo "     and the 'github-actions[bot]' app, then re-run this job."
              echo "Nothing was released; the tag and the bump stay unclaimed until this is fixed."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd src && zip -qr "../dist/tui-navigator-v$VERSION.zip" . -x '.DS_Store' '*/.DS_Store' 'Thumbs.db')
          unzip -l "dist/tui-navigator-v$VERSION.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-navigator-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          # Short retention: the zip also lives on the release, and Actions
          # artifacts do count against the account storage quota.
          retention-days: 7

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "Unpacked build of TUI Navigator v$VERSION."
            echo
            echo "**Install (Developer mode):**"
            echo
            echo "1. Download \`tui-navigator-v$VERSION.zip\` below and unzip it."
            echo "2. Open \`chrome://extensions/\` and turn on **Developer mode**."
            echo "3. Click **Load unpacked** and pick the unzipped folder (the one containing \`manifest.json\`)."
            echo
            echo "Built from commit $SHA."
          } > dist/notes.md
          cat dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "dist/tui-navigator-v$VERSION.zip" \
            --target "$SHA" \
            --title "TUI Navigator v$VERSION" \
            --notes-file dist/notes.md \
            --latest

      - name: Prune old releases
        if: env.KEEP_RELEASES != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASES }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt > dist/releases.json

          node -e "
            const all = JSON.parse(require('fs').readFileSync('dist/releases.json', 'utf8'));
            all.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const keep = Number(process.env.KEEP);
            console.error('Found ' + all.length + ' releases, keeping newest ' + keep);
            const stale = all.slice(keep).map(r => r.tagName);
            if (stale.length) process.stdout.write(stale.join('\n') + '\n');
          " > dist/stale.txt

          if [ ! -s dist/stale.txt ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting release $tag (and its tag)"
            gh release delete "$tag" --yes --cleanup-tag
          done < dist/stale.txt
