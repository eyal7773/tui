name: Release Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # How many releases to keep. Older ones (and their tags) are deleted after
  # each successful release. Set to 0 to disable pruning.
  KEEP_RELEASES: "5"

jobs:
  release:
    # An escape hatch: nothing here pushes to the repo any more, so this only
    # fires when a human deliberately asks for a commit not to be released.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The tags are the source of truth. Nothing is read from the repo and
          # nothing is written back to it, so main never moves on its own and a
          # local clone is never left behind after a release.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)

          if [ -n "$latest" ]; then
            subjects=$(git log --format=%s "$latest..HEAD")
            bodies=$(git log --format=%B "$latest..HEAD")
          else
            subjects=$(git log --format=%s)
            bodies=$(git log --format=%B)
          fi

          # Pruning deletes old tags, so ask the releases too before claiming a
          # number. Either list may be empty; neither is allowed to fail the run.
          taken=$(
            {
              git tag --list 'v*'
              gh release list --limit 200 --json tagName --jq '.[].tagName' || true
            } | sort -u
          )

          export LATEST="$latest"
          export SUBJECTS="$subjects"
          export TAKEN="$taken"

          # Handed over whole. Deciding what counts as a breaking-change footer
          # is the script's job, where it is covered by tests — a grep for the
          # words anywhere in the body reads a commit that merely mentions them
          # as a major release, which is how v1.0.0 escaped.
          export BODIES="$bodies"

          # Only used for the very first release, when there is no tag to read.
          export FALLBACK="$(node -p "require('./src/manifest.json').version")"

          version=$(node scripts/next-version.js)

          echo "Previous tag: ${latest:-(none)}"
          echo "Releasing v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Written in the runner only. The committed manifest keeps whatever
          # number it happens to hold; it is not what ships, and not what any
          # of this reads.
          node scripts/stamp-version.js "$VERSION"

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd src && zip -qr "../dist/tui-navigator-v$VERSION.zip" . -x '.DS_Store' '*/.DS_Store' 'Thumbs.db')
          unzip -l "dist/tui-navigator-v$VERSION.zip"

          # A second copy under a name that never changes. It is what
          # /releases/latest/download/tui-navigator.zip resolves to, which gives
          # the site a download link that outlives every release.
          cp "dist/tui-navigator-v$VERSION.zip" dist/tui-navigator.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-navigator-v${{ steps.version.outputs.version }}
          # The versioned copy only; the stable-named one is the same bytes and
          # artifacts count against the storage quota.
          path: dist/tui-navigator-v${{ steps.version.outputs.version }}.zip
          # Short retention: the zip also lives on the release, and Actions
          # artifacts do count against the account storage quota.
          retention-days: 7

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "Unpacked build of TUI Navigator v$VERSION."
            echo
            echo "**Install (Developer mode):**"
            echo
            echo "1. Download \`tui-navigator-v$VERSION.zip\` below and unzip it."
            echo "   (\`tui-navigator.zip\` is the same build under a name that never changes.)"
            echo "2. Open \`chrome://extensions/\` and turn on **Developer mode**."
            echo "3. Click **Load unpacked** and pick the unzipped folder (the one containing \`manifest.json\`)."
            echo
            echo "Built from commit $SHA."
          } > dist/notes.md
          cat dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "dist/tui-navigator-v$VERSION.zip" \
            "dist/tui-navigator.zip" \
            --target "$SHA" \
            --title "TUI Navigator v$VERSION" \
            --notes-file dist/notes.md \
            --latest

      - name: Prune old releases
        if: env.KEEP_RELEASES != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASES }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt > dist/releases.json

          node -e "
            const all = JSON.parse(require('fs').readFileSync('dist/releases.json', 'utf8'));
            all.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const keep = Number(process.env.KEEP);
            console.error('Found ' + all.length + ' releases, keeping newest ' + keep);
            const stale = all.slice(keep).map(r => r.tagName);
            if (stale.length) process.stdout.write(stale.join('\n') + '\n');
          " > dist/stale.txt

          if [ ! -s dist/stale.txt ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting release $tag (and its tag)"
            gh release delete "$tag" --yes --cleanup-tag
          done < dist/stale.txt
