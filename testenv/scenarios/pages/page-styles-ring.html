<!doctype html>
<html><head><meta charset="utf-8"><title>Page styles on the ring</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  /* MIT spaces the body's children with a rule like this one, and the ring,
     a div appended to the body, took the margin too: it sat 15px below
     every element. The others are what other sites set on every div. */
  body > div { margin-top: 15px; padding: 6px; border: 4px solid red; transform: translateX(10px); }
</style></head>
<body>
  <div><a id="one" href="#1">One</a></div>
  <div><a id="two" href="#2">Two</a></div>
</body></html>
