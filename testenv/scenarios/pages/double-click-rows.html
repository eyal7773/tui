<!doctype html>
<html><head><meta charset="utf-8"><title>Rows that open on a double-click</title>
<style>
  body { font: 14px sans-serif; margin: 40px; }
  tr[aria-selected="true"] { background: #cde; }
  td { padding: 6px 12px; }
</style></head>
<body>
  <!-- Drive's file list: a click selects a row, a double-click opens it. -->
  <p id="opened">nothing opened</p>
  <table role="grid">
    <tr role="row" tabindex="0" id="file1" aria-selected="false"><td>Report.docx</td></tr>
    <tr role="row" tabindex="-1" id="file2" aria-selected="false"><td>Budget.xlsx</td></tr>
    <!-- One whose click brings up a dialog: that did something, no hint. -->
    <tr role="row" tabindex="-1" id="details" aria-selected="false"><td>Show details</td></tr>
  </table>
  <script>
    document.querySelectorAll('tr').forEach((row) => {
      row.addEventListener('click', () => {
        document.querySelectorAll('tr').forEach((r) => r.setAttribute('aria-selected', String(r === row)));
        if (row.id === 'details') {
          const d = document.createElement('div');
          d.setAttribute('role', 'dialog');
          d.textContent = 'Details';
          document.body.appendChild(d);
        }
      });
      row.addEventListener('dblclick', (e) => {
        document.getElementById('opened').textContent = 'opened ' + row.id + ' detail=' + e.detail;
      });
    });
  </script>
</body></html>
