<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal beside a tall column</title>
<style>
  body { margin: 0; font: 14px sans-serif; height: 1400px; }
  #side { position: absolute; left: 10px; top: 300px; width: 100px; height: 30px; }
  /* A day column taller than the window, with an event far down it. */
  #day { position: absolute; left: 300px; top: 40px; width: 220px; height: 1200px;
         border-left: 1px solid #ccc; }
  #event { position: absolute; left: 4px; top: 600px; width: 200px; height: 40px;
           background: #9cf; cursor: pointer; }
  /* The event's details, in a fixed layer with no backdrop, over the
     column's upper part and level with the side button. */
  .layer { position: fixed; left: 130px; top: 60px; }
  .dialog { width: 340px; height: 440px; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
  .dialog a { position: absolute; left: 20px; }
</style>
</head>
<body>
  <button id="side">Booking</button>
  <div id="day" role="gridcell" tabindex="-1" aria-label="Monday">
    <div id="event" role="button" tabindex="0">Team sync</div>
  </div>
  <div class="layer">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Event details">
      <a id="join" href="#join" style="top: 40px">Join the call</a>
      <a id="phones" href="#phones" style="top: 210px">More phone numbers</a>
      <a id="notes" href="#notes" style="top: 300px">Meeting notes</a>
    </div>
  </div>
</body>
</html>
