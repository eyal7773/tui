<!doctype html>
<html><head><meta charset="utf-8"><title>Bottom bar</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  #bar { position: fixed; left: 40px; right: 40px; bottom: 16px; background: #eef; padding: 16px; }
  .gap { height: 1500px; }
</style></head>
<body>
  <!-- PayPal's cookie strip floats along the bottom without covering the
       page. Once the ring was in it, ArrowDown only scrolled the page, as
       whatever came into view was above the strip; and once out of it, the
       next ArrowDown went straight back, since it lies below everything. -->
  <a id="top" href="#t">Top link</a>
  <div class="gap"></div>
  <a id="one" href="#1">Further down</a>
  <div style="height: 600px"></div>
  <a id="two" href="#2">Further still</a>
  <div class="gap"></div>
  <div id="bar">We use cookies. <button id="accept">Accept</button> <button id="decline">Decline</button></div>
</body></html>
