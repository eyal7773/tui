<!doctype html>
<html><head><meta charset="utf-8"><title>Select text</title>
<style>
  body { font: 16px sans-serif; margin: 40px; width: 600px; }
  /* Room to scroll, to see the caret keep up. */
  .room { height: 2000px; }
</style></head>
<body>
  <header id="head">Site header</header>
  <main>
    <a id="title" href="#title">Getting started</a>
    <p id="para">The quick brown fox jumps over the lazy dog. A second sentence follows it.</p>
    <button id="after">After</button>
    <div class="room"></div>
  </main>
  <script>
    // What was copied, as the page sees it.
    document.addEventListener('copy', () => { window.copied = String(getSelection()); });
  </script>
</body></html>
