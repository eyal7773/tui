<!doctype html>
<html><head><meta charset="utf-8"><title>Modal over page</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  .card { display: inline-block; margin: 20px; }
  #cover { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
  #dialog { background: #fff; padding: 30px; }
  #chat { position: fixed; right: 20px; bottom: 20px; }
</style></head>
<body>
  <!-- A page with a dialog over the whole window. Nothing behind the cover
       can be seen, so the ring belongs in the dialog. -->
  <a class="card" href="#a">Behind one</a>
  <a class="card" href="#b">Behind two</a>
  <p style="height: 300px"></p>
  <a class="card" href="#c">Behind three</a>
  <div id="cover">
    <div id="dialog">
      <p>Accept cookies?</p>
      <button id="accept">Accept</button>
      <button id="reject">Reject</button>
    </div>
  </div>
</body></html>
