<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A pinned side column beside a pinned bar</title>
<style>
  html, body { margin: 0; font: 14px sans-serif; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fff; z-index: 3; }
  .side { position: fixed; top: 56px; left: 0; bottom: 0; width: 240px; background: #fafafa; z-index: 2; padding: 12px; box-sizing: border-box; }
  .side a { display: block; height: 40px; line-height: 40px; }
  /* Starts 24px past the side column, so it does not adjoin it. */
  .chips { position: fixed; top: 56px; left: 240px; right: 0; height: 56px; background: #fff; z-index: 2; padding: 12px 24px; box-sizing: border-box; display: flex; gap: 12px; }
  .chips button { height: 32px; }
  .grid { margin: 136px 0 0 264px; display: grid; grid-template-columns: repeat(3, 400px); gap: 24px; }
  /* The picture takes no focus: the title is the card's only stop. */
  .thumb { display: block; height: 300px; background: #ccd; }
  .title { display: block; height: 22px; margin-top: 8px; }
  .card { height: 420px; }
</style>
</head>
<body>
  <div class="topbar"><a id="logo" href="#logo">Logo</a></div>
  <nav class="side">
    <a id="side-1" href="#side-1">Start</a>
    <a id="side-2" href="#side-2">Clips</a>
    <a id="side-3" href="#side-3">Saved</a>
    <a id="side-4" href="#side-4">Later</a>
    <a id="side-5" href="#side-5">Liked</a>
    <a id="side-6" href="#side-6">Own</a>
    <a id="side-7" href="#side-7">Files</a>
    <a id="side-8" href="#side-8">Extras</a>
    <a id="side-9" href="#side-9">Help</a>
  </nav>
  <div class="chips" role="tablist">
    <button id="chip-all" role="tab" aria-selected="true">All</button>
    <button id="chip-music" role="tab" aria-selected="false">Music</button>
    <button id="chip-news" role="tab" aria-selected="false">News</button>
  </div>
  <main class="grid">
    <div class="card"><a class="thumb" href="#a" tabindex="-1" aria-hidden="true"></a><a id="card-1" class="title" href="#a">First video</a></div>
    <div class="card"><a class="thumb" href="#b" tabindex="-1" aria-hidden="true"></a><a id="card-2" class="title" href="#b">Second video</a></div>
    <div class="card"><a class="thumb" href="#c" tabindex="-1" aria-hidden="true"></a><a id="card-3" class="title" href="#c">Third video</a></div>
    <div class="card"><a class="thumb" href="#d" tabindex="-1" aria-hidden="true"></a><a id="card-4" class="title" href="#d">Fourth video</a></div>
    <div class="card"><a class="thumb" href="#e" tabindex="-1" aria-hidden="true"></a><a id="card-5" class="title" href="#e">Fifth video</a></div>
    <div class="card"><a class="thumb" href="#f" tabindex="-1" aria-hidden="true"></a><a id="card-6" class="title" href="#f">Sixth video</a></div>
  </main>
</body>
</html>
