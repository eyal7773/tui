<!doctype html>
<html><head><meta charset="utf-8"><title>Rows clickable by script alone</title>
<style>
  body { font: 15px sans-serif; margin: 0; display: flex; }
  nav { width: 200px; padding: 20px; }
  nav a { display: block; padding: 10px 0; }
  main { padding: 20px; }
  table { border-collapse: collapse; width: 420px; margin-top: 16px; }
  tr.item { cursor: pointer; }
  tr.item td { padding: 14px 8px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 11px; background: #4a7; color: white; padding: 1px 5px; }
</style></head>
<body>
  <!-- A results list whose rows have no link, button, tabindex or role: a
       script opens a row on click, and the pointer cursor is the only sign.
       ArrowDown from the search box went to the side menu instead. -->
  <nav>
    <a href="#home">Home</a><a href="#reports">Reports</a><a href="#tools">Tools</a>
    <a href="#settings">Settings</a><a href="#help">Help</a>
  </nav>
  <main>
    <input id="search" type="search" value="tea">
    <table><tbody id="rows"></tbody></table>
    <p id="opened">nothing opened</p>
  </main>
  <script>
    const rows = document.getElementById('rows');
    const add = (name, count) => {
      const tr = document.createElement('tr');
      tr.className = 'item';
      tr.innerHTML = '<td><strong>' + name + '</strong><br>Tea house, ' + count + ' kinds</td><td><span class="badge">' + count + '</span></td>';
      tr.addEventListener('click', () => { document.getElementById('opened').textContent = 'opened ' + name; });
      rows.appendChild(tr);
    };
    add('Green tea', 12);
    add('Black tea', 7);
    // One more arrives after the first press, as a slow result would: the
    // scan is kept between presses, and a change to the page renews it.
    setTimeout(() => add('White tea', 3), 1500);
  </script>
</body></html>
