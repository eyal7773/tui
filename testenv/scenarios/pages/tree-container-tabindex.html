<!doctype html>
<html><head><meta charset="utf-8"><title>Tree that keeps tabindex -1</title>
<style>
  body { font: 15px sans-serif; margin: 0; display: flex; }
  #sidebar { width: 260px; position: relative; height: 400px; background: #3f0e40; color: #fff; }
  .channel { position: absolute; left: 0; right: 0; height: 28px; line-height: 28px; padding-left: 16px; cursor: pointer; }
  #messages { flex: 1; }
  .message { padding: 4px 16px; border-bottom: 1px solid #ddd; cursor: pointer; }
</style></head>
<body>
  <!-- Slack's sidebar: a virtual list with role="tree" and tabindex="-1",
       whose channels are absolutely placed treeitems. Only the current
       channel has tabindex="0"; the rest have -1, and with the tree's own -1
       above them they were taken for hidden helpers and dropped, so
       ArrowLeft from a message skipped the channel beside it. -->
  <div id="sidebar" role="tree" tabindex="-1">
    <div class="channel" role="treeitem" tabindex="-1" id="unreads" style="top: 0">Unreads</div>
    <div class="channel" role="treeitem" tabindex="0" id="current" style="top: 40px">Dana</div>
    <div class="channel" role="treeitem" tabindex="-1" id="starred" style="top: 80px">Starred</div>
    <div class="channel" role="treeitem" tabindex="-1" id="support" style="top: 108px">general</div>
    <div class="channel" role="treeitem" tabindex="-1" id="release" style="top: 136px">random</div>
  </div>
  <div id="messages" role="list">
    <div class="message" role="listitem" tabindex="-1" id="m1" style="height: 24px">First message</div>
    <div class="message" role="listitem" tabindex="-1" id="m2" style="height: 24px">Second message</div>
    <div class="message" role="listitem" tabindex="-1" id="m3" style="height: 24px">Third message</div>
    <div class="message" role="listitem" tabindex="-1" id="m4" style="height: 30px">Fourth message, beside general</div>
  </div>
</body></html>
