<!doctype html>
<html><head><meta charset="utf-8"><title>Fixed frame over page</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: rgba(200,200,200,.9); }
</style></head>
<body>
  <!-- A bot check in a fixed frame over the whole window (Target). The frame
       is what the ring should reach; Enter then steps into it. -->
  <a href="#a">Behind one</a>
  <a href="#b">Behind two</a>
  <iframe id="check" title="Bot check" srcdoc="<p>Press and hold</p><button>Hold</button>"></iframe>
</body></html>
