<!doctype html>
<html><head><meta charset="utf-8"><title>Panel opened by a checkbox, CSS alone</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  #toggle { position: absolute; opacity: 0; }
  .panel { display: none; padding: 10px; background: #eee; }
  /* Checking the box changes no attribute; only the CSS sees it. */
  #toggle:checked ~ .panel { display: block; }
  main { margin-top: 40px; }
</style></head>
<body>
  <!-- A menu button made of a hidden checkbox and its label, as in a menu
       with no script: Enter checks the box and the panel shows, with no
       element changing. Its links must be reached. -->
  <p><a id="top" href="#top">Top link</a></p>
  <input type="checkbox" id="toggle">
  <label id="menu-button" for="toggle">Menu</label>
  <div class="panel"><a id="panel-first" href="#garden">Garden</a> <a href="#kitchen">Kitchen</a></div>
  <main><a id="story" href="#story">A story further down</a></main>
</body></html>
