<!doctype html>
<html><head><meta charset="utf-8"><title>Search box focused by the page</title>
<style>
  body { font: 16px sans-serif; margin: 0; }
  header { display: flex; justify-content: space-between; padding: 8px 40px; background: #eee; }
  .search { margin: 24px auto; width: 500px; }
  .search input { width: 100%; height: 40px; }
  main { display: flex; gap: 20px; padding: 0 40px; }
  main a { display: block; width: 160px; height: 100px; border: 1px solid #999; }
</style></head>
<body>
  <!-- A portal focuses its search box as it loads, from its own script.
       Every arrow stayed in the box, so the logo and the profile menu
       above it could not be reached. -->
  <header>
    <a id="logo" href="#home">Example portal</a>
    <button id="profile">Profile</button>
  </header>
  <div class="search"><input id="search" type="text" aria-label="Search"></div>
  <main>
    <a id="tile-1" href="#1">Mail</a>
    <a id="tile-2" href="#2">Calendar</a>
  </main>
  <script>document.getElementById('search').focus();</script>
</body></html>
