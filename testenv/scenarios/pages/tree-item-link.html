<!doctype html>
<html><head><meta charset="utf-8"><title>Tree items that wrap their link</title>
<style>
  body { font: 15px sans-serif; margin: 0; display: flex; }
  #sidebar { width: 260px; background: #3f0e40; color: #fff; padding: 8px 0; }
  .item { height: 28px; line-height: 28px; display: flex; }
  .item a { flex: 1; color: inherit; text-decoration: none; padding-left: 16px; }
  .item .more { width: 24px; }
  .children { padding-left: 12px; }
  #view { flex: 1; padding: 16px; }
</style></head>
<body>
  <!-- A chat app's sidebar: the treeitem rows take focus, but the click
       handler is on the link inside each one, the way a router link is.
       A click on the row itself never reaches it. -->
  <div id="sidebar" role="tree" tabindex="-1">
    <div class="item" role="treeitem" tabindex="0" id="t-threads"><a href="/client/threads">Threads</a></div>
    <div class="item" role="treeitem" tabindex="-1" id="t-calendar"><a href="/client/calendar">Calendar <span>2</span></a><button class="more" aria-haspopup="menu" aria-label="More"></button></div>
    <div role="treeitem" tabindex="-1" id="t-section" aria-expanded="true">
      <div class="item"><span>Channels</span></div>
      <div class="children" role="group">
        <div class="item" role="treeitem" tabindex="-1" id="t-general"><a href="/client/general">general</a></div>
      </div>
    </div>
  </div>
  <div id="view">Nothing open</div>
  <script>
    document.getElementById('sidebar').addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link) {
        e.preventDefault();
        document.getElementById('view').textContent = 'Open: ' + link.getAttribute('href');
      }
      const section = e.target.closest('#t-section');
      if (section && !link) section.setAttribute('aria-expanded',
        section.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    });
  </script>
</body></html>
