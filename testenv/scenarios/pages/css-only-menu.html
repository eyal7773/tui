<!doctype html>
<html><head><meta charset="utf-8"><title>Menu opened by CSS alone</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  nav > ul { display: flex; gap: 40px; list-style: none; padding: 0; }
  nav li { position: relative; }
  nav li ul { display: none; position: absolute; top: 24px; left: 0; list-style: none; padding: 8px; background: #eee; }
  /* No script: focus inside the item shows its submenu. */
  nav li:focus-within ul { display: block; }
  main { margin-top: 160px; }
</style></head>
<body>
  <!-- A menu shown by :focus-within changes no element, so no mutation says
       the page changed: its items must still be reached. -->
  <p><a id="top" href="#top">Top link</a></p>
  <nav><ul>
    <li><a id="products" href="#products">Products</a>
      <ul><li><a id="first-item" href="#lamps">Lamps</a></li><li><a href="#chairs">Chairs</a></li></ul></li>
    <li><a href="#about">About</a></li>
  </ul></nav>
  <main><a id="story" href="#story">A story further down</a></main>
</body></html>
