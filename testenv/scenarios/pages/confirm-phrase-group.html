<!doctype html>
<html><head><meta charset="utf-8"><title>A confirm box grouped with its label and a Copy button</title>
<style>
  body { font: 14px sans-serif; margin: 0; padding: 40px; background: #eef; }
  .dialog { width: 360px; padding: 16px; background: #fff; border-radius: 8px; }
  .option { margin-bottom: 18px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .phrase-row { display: flex; align-items: center; gap: 8px; }
  .phrase-row code { background: #f3f3f3; padding: 2px 6px; }
  .form-group input[type=text] { width: 100%; box-sizing: border-box; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style></head>
<body>
  <!-- A confirm step: the label, the phrase with a Copy button beside it,
       and the box to type the phrase into share one form group with no
       other wrapper around the box. The box is reached through the group,
       which also holds Copy. -->
  <div class="dialog">
    <label class="option"><input type="checkbox" id="also-migrate"> Also run the migrations</label>
    <div class="form-group">
      <label for="confirm-input">Type the phrase below to confirm</label>
      <div class="phrase-row"><code>restore orchard</code><button type="button" id="copy">Copy</button></div>
      <input type="text" id="confirm-input">
    </div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="button" id="restore">Restore</button>
    </div>
  </div>
</body></html>
