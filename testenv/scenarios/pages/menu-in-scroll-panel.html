<!doctype html>
<html><head><meta charset="utf-8"><title>Menu pinned inside a scrolling panel</title>
<style>
  body { font: 16px sans-serif; margin: 0; }
  #main { position: absolute; left: 0; top: 0; width: 700px; padding: 20px; }
  /* A side panel that scrolls on its own, with more in it than fits. */
  #panel { position: absolute; left: 720px; top: 0; width: 400px; height: 100vh; overflow: auto; border-left: 1px solid #888; }
  #panel .row { height: 40px; margin: 8px 16px; }
  #panel button { height: 32px; }
  #more { position: absolute; left: 1060px; top: 10px; width: 40px; }
  /* The "..." menu: in the panel's markup, but pinned to the window, over
     the panel's own buttons. A button behind it lies just below its first item. */
  #menu { position: fixed; left: 880px; top: 50px; width: 220px; background: #fff;
          border: 1px solid #888; z-index: 5; display: none; }
  #menu.open { display: block; }
  #menu button { display: block; width: 100%; height: 40px; text-align: left; border: 0; background: #fff; }
  #menu hr { margin: 6px 0; }
</style></head>
<body>
  <!-- An issue tracker's issue page: the side panel scrolls, and its "..."
       menu opens over it. The open menu takes focus straight back from
       anything outside it. ArrowDown from the menu's first item was kept to
       the panel's buttons, which the menu would not let take focus, and the
       ring never moved. -->
  <div id="main"><h1>Fix the login timeout</h1><p>Some text about the issue.</p><button>Edit</button></div>
  <div id="panel">
    <button id="more" aria-label="More actions" tabindex="0">…</button>
    <div class="row" style="margin-top: 50px"><button id="status">To do</button></div>
    <div class="row"><button id="improve">Improve - Story</button></div>
    <div class="row"><button>Assignee: Dana Fox</button></div>
    <div class="row"><button>Reviewer: Lee Park</button></div>
    <div class="row"><button>Sprint 12</button></div>
    <div class="row"><button>Team: Core</button></div>
    <div class="row"><button>Labels</button></div>
    <div class="row"><button>Parent</button></div>
    <div class="row"><button>Due date</button></div>
    <div style="height: 1200px"></div>
    <div id="menu" role="menu">
      <button role="menuitem" tabindex="-1" id="log">Log work</button>
      <hr>
      <button role="menuitem" tabindex="-1" id="flag">Add flag</button>
      <button role="menuitem" tabindex="-1" id="vote">Add vote</button>
      <hr>
      <button role="menuitem" tabindex="-1" id="clone">Clone</button>
      <button role="menuitem" tabindex="-1" id="move">Move</button>
    </div>
  </div>
  <script>
    const menu = document.getElementById('menu');
    document.getElementById('more').addEventListener('click', () => {
      menu.classList.add('open');
      document.getElementById('log').focus();
    });
    // While open, focus stays in the menu.
    document.addEventListener('focusin', (e) => {
      if (menu.classList.contains('open') && !menu.contains(e.target)) document.getElementById('log').focus();
    }, true);
  </script>
</body></html>
